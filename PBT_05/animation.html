<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations & Transitions</title>
    <link rel="stylesheet" href="animation.css">
</head>
<body>
    <div class="container">
        <h1>CSS Transitions & Animations</h1>

        <div class="products">
            <div class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/300/200?random=1" alt="Product">
                </div>
                <h3>iPhone 16 Pro</h3>
                <p class="price">28.990.000 ₫</p>
                <button class="btn">Mua ngay</button>
            </div>

            <div class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/300/200?random=2" alt="Product">
                </div>
                <h3>MacBook Air M3</h3>
                <p class="price">32.990.000 ₫</p>
                <button class="btn">Mua ngay</button>
            </div>

            <div class="card">
                <div class="img-container">
                    <img src="https://picsum.photos/300/200?random=3" alt="Product">
                </div>
                <h3>Galaxy S25 Ultra</h3>
                <p class="price">24.500.000 ₫</p>
                <button class="btn">Mua ngay</button>
            </div>
        </div>

        <div class="spinner-container">
            <h2>Loading Spinner</h2>
            <div class="spinner"></div>
        </div>

        <div class="fade-section">
            <h2>Fade In khi scroll (CSS Only)</h2>
            <div class="fade-box">Phần tử 1 - Fade In</div>
            <div class="fade-box" style="animation-delay: 0.3s;">Phần tử 2 - Fade In</div>
            <div class="fade-box" style="animation-delay: 0.6s;">Phần tử 3 - Fade In</div>
        </div>
    </div>
</body>
</html>
