<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop-Tlu</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">Hoàng Ngọc Tú</div>
        
        <div class="menu">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Về chúng tôi</a>
        </div>
        
        <div class="auth">
            <a href="#" class="btn-login">Đăng nhập</a>
            <a href="#" class="btn-register">Đăng ký</a>
        </div>
    </nav>

    <div class="container">
        <h2>Sản phẩm nổi bật</h2>
        <div class="products">
            <div class="card">
                <h3>iPhone 16</h3>
                <p class="price">28.990.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>MacBook Air</h3>
                <p class="price">32.990.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>Galaxy S25</h3>
                <p class="price">24.500.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>AirPods Pro</h3>
                <p class="price">5.990.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>Apple Watch</h3>
                <p class="price">12.990.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>iPad Pro</h3>
                <p class="price">22.500.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>Sony WH-1000</h3>
                <p class="price">7.490.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
            <div class="card">
                <h3>Xiaomi 14</h3>
                <p class="price">18.990.000 ₫</p>
                <button class="btn">Thêm vào giỏ</button>
            </div>
        </div>
    </div>

</body>
</html>
