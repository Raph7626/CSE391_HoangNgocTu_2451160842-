<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid E-Commerce</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    
    <div class="container">
      
        <aside class="sidebar">
            <h3>Bộ lọc sản phẩm</h3>
            <label><input type="checkbox" checked> Apple</label><br>
            <label><input type="checkbox"> Samsung</label><br>
        </aside>

        <main class="main-content">
            <h2>Sản phẩm</h2>
            <div class="products-grid">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
            </div>
        </main>

        <!-- ADS -->
        <aside class="ads">
            <img src="https://picsum.photos/250/600" alt="ads">
            <p>Quảng cáo</p>
        </aside>
    </div>

</body>
</html>
