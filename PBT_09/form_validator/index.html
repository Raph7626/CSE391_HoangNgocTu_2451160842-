<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Đăng Ký Tài Khoản</h1>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullName" placeholder="Nguyễn Văn A">
                <small class="status"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com">
                <small class="status"></small>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••">
                <div class="strength-meter">
                    <div id="strengthBar"></div>
                </div>
                <small class="status" id="passwordStatus"></small>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
                <small class="status"></small>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phone" maxlength="13" placeholder="0901-234-567">
                <small class="status"></small>
            </div>

            <button type="submit" id="submitBtn" disabled>Đăng Ký</button>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h2>🎉 Đăng ký thành công!</h2>
            <div id="modalInfo"></div>
            <button onclick="location.reload()">Đóng</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
